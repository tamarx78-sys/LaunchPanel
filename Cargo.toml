[package]
name = "launchpanel"
version = "2.0.0"
edition = "2024"
authors = ["Tamarx78-sys"]
description = "A lightweight, dependency-free launcher panel for Windows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tamarx78-sys/LaunchPanel"
keywords = ["launcher", "windows", "desktop", "direct2d"]
categories = ["gui"]

[[bin]]
name = "LaunchPanel"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Com_StructuredStorage", "Win32_UI_Accessibility"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
