[package]
name = "launchpanel"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Security"] }
windows-numerics = "0.3.1"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
