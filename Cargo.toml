[package]
name = "launchpanel"
version = "1.1.1"
edition = "2024"
authors = ["Tamarx78-sys"]
rust-version = "1.85"
description = "A lightweight, customizable launcher panel for Windows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tamarx78-sys/LaunchPanel"
keywords = ["launcher", "windows", "desktop", "egui"]
categories = ["gui"]

[[bin]]
name = "LaunchPanel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

eframe = "0.33"
egui = "0.33"
tray-icon = "0.21"
image = "0.25"

windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
